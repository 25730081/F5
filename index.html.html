<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0차 - 1~5번째 화면</title>
<style>
:root{--bg:#f2f2f0;--paper:#fff;--ink:#222;--sub:#777;--line:#c9c9c4;--fill:#e8e8e4;--acc:#2f5bd8;--accbg:#e6ecfc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;justify-content:center;height:100dvh;overflow:hidden}
.app{width:100%;max-width:390px;height:100dvh;min-height:0;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden}
header{height:66px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 17px;border-bottom:1.5px solid var(--ink);background:var(--paper)}
.logo{display:flex;align-items:center;gap:7px;font-size:22px;font-weight:800;letter-spacing:-1px}
.logo-mark{width:23px;height:23px;border:2px solid var(--ink);border-radius:50%;display:inline-block}
.timer{border:1.5px solid var(--ink);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
main{padding:22px 17px 16px;display:flex;flex:1;flex-direction:column;gap:14px}
h1{font-size:19px;line-height:1.45;margin:0;font-weight:800;letter-spacing:-.6px}
.sub{font-size:12px;color:var(--sub);margin-top:-7px}
.field{border:1.5px solid var(--ink);padding:12px;border-radius:9px;background:var(--paper)}
.label{font-size:11px;color:var(--sub);margin-bottom:6px}
.location-input{width:100%;border:0;outline:0;font:inherit;font-size:14px;background:transparent;color:var(--ink)}
.location-input::placeholder{color:#777}
.time-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);font-size:20px;cursor:pointer}
.time-value{font-size:20px;font-weight:800;letter-spacing:-.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.2px solid var(--line);border-radius:99px;padding:6px 10px;background:var(--paper);font-size:12px;cursor:pointer;color:var(--ink)}
.chip.active{background:var(--acc);border-color:var(--acc);color:#fff}
.previous{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.primary{width:100%;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:15px 12px;font-size:14px;font-weight:700;cursor:pointer}
main.home-main .primary{margin-top:auto}
.nav{height:66px;min-height:66px;flex:0 0 66px;border-top:1.5px solid var(--ink);display:flex;justify-content:space-around;align-items:center;background:var(--paper);padding-bottom:env(safe-area-inset-bottom);z-index:2}
.nav button{border:0;background:transparent;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:54px;padding:0}
.nav .symbol{display:none}
.nav button:before{content:"";display:block;width:18px;height:18px;border:1.5px solid currentColor;border-radius:5px;margin:0 auto 1px}
.nav button.active{color:var(--ink);font-weight:800}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.show{display:flex}
/* 6~8번 화면은 iframe 안에 표시하므로 부모 화면 높이에 맞춤 */
.screen.external-screen{padding:0;overflow:hidden}
.screen.external-screen iframe{display:block;width:100%;height:100%;min-height:0;flex:1;border:0;background:#fff}
.list-main{padding-top:15px;gap:12px;overflow-y:auto;padding-bottom:18px}
.searchbox{display:flex;gap:8px;align-items:center}
.searchbox input{min-width:0;flex:1;border:0;outline:0;font:inherit;font-size:13px;background:transparent}
.results-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.small-actions{display:flex;gap:6px}
.small-btn{border:1.2px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--paper);font-size:11px;color:var(--ink);cursor:pointer}
.place-list{display:flex;flex-direction:column;gap:10px}
.place-card{display:grid;grid-template-columns:76px minmax(0,1fr) 24px;gap:10px;align-items:center;border:1.5px solid var(--ink);border-radius:9px;padding:9px;cursor:pointer;background:#fff}
.place-img{height:78px;border:1px solid var(--line);border-radius:6px;background:repeating-linear-gradient(135deg,#e4e4e1 0,#e4e4e1 8px,#f5f5f2 8px,#f5f5f2 16px);display:flex;align-items:center;justify-content:center;color:#777;font-size:10px}
.place-name{font-size:13px;font-weight:800;margin-bottom:4px}
.place-kind{font-size:11px;color:var(--sub);margin-bottom:6px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;background:var(--fill);border-radius:5px;padding:4px 5px;white-space:nowrap}
.tag.good{background:var(--accbg);color:var(--acc)}
.tag.tight{background:#f0f0ee;color:#777}
.heart{border:0;background:transparent;font-size:20px;cursor:pointer;color:#777;padding:0}
.heart.saved{color:var(--acc)}
.empty{font-size:12px;color:var(--sub);text-align:center;padding:24px 10px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#222;color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;display:none;z-index:5;white-space:nowrap}
.toast.show{display:block}
.modal-bg{display:none;position:absolute;inset:0;background:#0005;z-index:3;align-items:flex-end}
.modal-bg.open{display:flex}
.sheet{width:100%;background:var(--paper);border-top:2px solid var(--ink);border-radius:18px 18px 0 0;padding:18px 17px 22px;display:flex;flex-direction:column;gap:14px}
.sheet-title{font-size:15px;font-weight:800;display:flex;justify-content:space-between}
.sheet-section{display:flex;flex-direction:column;gap:8px}
.sheet-label{font-size:12px;font-weight:700}
.sheet .chips{margin-top:0}
.sheet .chip{padding:8px 10px}
.sheet .primary{margin-top:2px}
 
.detail-main{padding:10px 17px 16px;display:flex;flex:1;min-height:0;flex-direction:column;gap:12px}
.detail-image{height:140px;flex:none;border:1.5px solid var(--line);border-radius:8px;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px))}
.detail-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.detail-title-row h1{font-size:17px}
.detail-title-row .place-kind{margin-top:3px;margin-bottom:0}
.detail-info{display:flex;flex-direction:column;gap:13px}
.detail-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}
.detail-line span{color:var(--sub);white-space:nowrap}
.detail-line strong{font-size:12px;text-align:right}
.detail-actions{display:flex;gap:8px;margin-top:auto}
.secondary-action{flex:1;border:1.5px solid var(--ink);border-radius:9px;background:var(--paper);padding:12px 6px;font-size:12px;font-weight:700;white-space:nowrap}
.detail-actions .primary{flex:1;padding:12px 6px;font-size:12px;white-space:nowrap}
.map-screen{min-height:0;overflow:hidden}
.map-main{padding:0;gap:0;min-height:0;overflow:hidden}
.map-canvas{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--fill);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}
.map-canvas svg{position:absolute;inset:0;width:100%;height:100%}
.map-pin{position:absolute;padding:3px 8px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;white-space:nowrap;z-index:1}
.map-pin.dest{background:var(--acc);color:#fff}
.course-summary{flex:none;background:var(--paper);border-top:2px solid var(--ink);padding:12px 16px 10px;display:flex;flex-direction:column;gap:7px}
.course-summary-title{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800}
.course-summary-info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.course-actions{display:flex;gap:8px}
.course-actions button{flex:1;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);padding:9px 5px;font-size:12px;font-weight:700;white-space:nowrap}
.course-actions button.primary{background:var(--ink);color:#fff}
@media(min-width:500px){body{padding:18px 0;height:100dvh}.app{min-height:0;height:calc(100dvh - 36px);border:1.5px solid #bbb;border-radius:28px;box-shadow:0 12px 40px #0001}.modal-bg{border-radius:28px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="logo-mark"></span>0차</div>
    <button class="timer" id="timer" aria-label="남은 웨이팅 시간 수정">⏱ <span id="timerText">3:00:00</span></button>
  </header>

  <section class="screen show" id="homeScreen">
    <main class="home-main">
      <h1>본격적인 식사 전,<br>기다리는 동안의 첫 번째 코스</h1>
      <div class="sub">웨이팅 시간을 알차게 보내는 주변 공간 추천</div>
      <div class="field">
        <div class="label">식당 위치</div>
        <div class="searchbox">📍 <input id="locationInput" class="location-input" placeholder="식당 주변 검색 (예: 성수역)" value="성수역"></div>
      </div>
      <div class="field">
        <div class="label">남은 웨이팅 시간</div>
        <div class="time-row">
          <button class="step" id="minusTime" aria-label="시간 줄이기">−</button>
          <div class="time-value" id="timeValue">3시간 00분</div>
          <button class="step" id="plusTime" aria-label="시간 늘리기">+</button>
        </div>
        <div class="chips" id="timeChips">
          <button class="chip" data-minutes="30">30분</button>
          <button class="chip" data-minutes="60">1시간</button>
          <button class="chip" data-minutes="120">2시간</button>
          <button class="chip active" data-minutes="180">3시간</button>
        </div>
      </div>
      <div class="field previous" id="loadPrevious"><span>이전 웨이팅 불러오기</span><span>›</span></div>
      <button class="primary" id="findPlaces">주변 공간 찾기　→</button>
    </main>
  </section>

  <section class="screen" id="listScreen">
    <main class="list-main">
      <div class="field searchbox">🔍 <input id="placeSearch" placeholder="지역·장소 검색"></div>
      <div class="chips" id="selectedCategoryChips">
        <button class="chip active" data-remove-category="카페">카페 ✕</button>
        <button class="chip active" data-remove-category="소품샵">소품샵 ✕</button>
      </div>
      <div class="results-row">
        <span id="resultCount">결과 6건</span>
        <div class="small-actions">
          <button class="small-btn" id="sortButton">거리순 ▾</button>
          <button class="small-btn" id="filterButton">필터 ⚙</button>
        </div>
      </div>
      <div class="place-list" id="placeList"></div>
    </main>
  </section>

  <section class="screen" id="detailScreen">
    <main class="detail-main">
      <div class="detail-image" aria-label="공간 대표 이미지"></div>
      <div class="detail-title-row">
        <div><h1 id="detailName">카페 모리</h1><div class="place-kind" id="detailCategory">카페</div></div>
        <span class="tag good" id="detailTimeTag">여유 1시간</span>
      </div>
      <div class="field detail-info">
        <div class="detail-line"><span>주소</span><strong>서울 성동구 …</strong></div>
        <div class="detail-line"><span>영업시간</span><strong>00:00–00:00</strong></div>
        <div class="detail-line"><span>이동거리</span><strong id="detailDistance">480m</strong></div>
        <div class="detail-line"><span>예상 이동시간</span><strong id="detailWalk">도보 6분</strong></div>
        <div class="detail-line"><span>추천 체류시간</span><strong id="detailStay">90분</strong></div>
      </div>
      <div class="detail-actions">
        <button class="secondary-action" id="saveDetail">♡ 관심공간 저장</button>
        <button class="primary" id="addToCourse">＋ 0차 공간 추가</button>
      </div>
    </main>
  </section>

  <section class="screen map-screen" id="mapScreen">
    <main class="map-main">
      <div class="map-canvas" id="mapCanvas" aria-label="식당과 추가한 공간의 이동 경로 지도">
        <svg viewBox="0 0 375 500" preserveAspectRatio="none" aria-hidden="true">
          <polyline id="routeLine" points="60,430 60,320 145,320 145,210 250,210 250,100 315,100" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="map-pin" style="left:5%;bottom:12%">식당</div>
        <div class="map-pin dest" id="mapPinOne" style="left:30%;bottom:43%">1 카페 모리</div>
        <div class="map-pin dest" id="mapPinTwo" style="left:57%;bottom:65%">2 소품샵 담</div>
        <div class="map-pin" style="right:5%;top:10%">식당 복귀</div>
      </div>
      <div class="course-summary">
        <div class="course-summary-title"><span>오늘의 0차 코스</span><span class="tag" id="courseCount">장소 2곳</span></div>
        <div class="course-summary-info"><span id="courseDuration">총 2시간 20분</span><span id="courseReturn">복귀 마감까지 여유 18분</span></div>
        <div class="course-actions"><button id="courseDetailButton">코스 상세</button><button class="primary" id="addMorePlaces">장소 더 추가</button></div>
      </div>
    </main>
  </section>


  <section class="screen external-screen" id="favoritesScreen">
    <iframe title="6번 관심공간 화면" srcdoc="&lt;!DOCTYPE html&gt;

&lt;style&gt;

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;span id=&quot;timer&quot; hidden&gt;2:36:40&lt;/span&gt;
  &lt;main&gt;

      &lt;button class=&quot;text-button&quot; id=&quot;edit-toggle&quot; type=&quot;button&quot;&gt;편집&lt;/button&gt;

    &lt;section class=&quot;list&quot; id=&quot;place-list&quot; aria-label=&quot;저장한 관심공간&quot;&gt;

$$(&#x27;.stop-actions&#x27;).forEach(el=&gt;el.style.visibility=&#x27;hidden&#x27;);
function reorderStops(stop, direction){
  const current = stop.closest(&#x27;.stop&#x27;);
  const other = direction===&#x27;up&#x27; ? current.previousElementSibling : current.nextElementSibling;
  if(!other || !other.matches(&#x27;.stop[data-stop]&#x27;)) return showToast(&#x27;더 이동할 수 없는 순서예요.&#x27;);
  if(direction===&#x27;up&#x27;) current.parentNode.insertBefore(current,other);
  else current.parentNode.insertBefore(other,current);
  const stops = $$(&#x27;.stop[data-stop]&#x27;);
  stops.forEach((node,i)=&gt;{node.querySelector(&#x27;.stop-name&#x27;).textContent=`${i+1}. ${node.dataset.stop===&#x27;cafe&#x27;?&#x27;카페 모리&#x27;:&#x27;소품샵 담&#x27;}`;});
  showToast(&#x27;방문 순서를 변경했어요.&#x27;);
}
$$(&#x27;.up&#x27;).forEach(btn=&gt;btn.addEventListener(&#x27;click&#x27;,()=&gt;reorderStops(btn,&#x27;up&#x27;)));
$$(&#x27;.down&#x27;).forEach(btn=&gt;btn.addEventListener(&#x27;click&#x27;,()=&gt;reorderStops(btn,&#x27;down&#x27;)));
$(&#x27;#confirmBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  $(&#x27;#modalTitle&#x27;).textContent=&#x27;이 코스로 결정할까요?&#x27;;
  $(&#x27;#modalText&#x27;).textContent=`예상 소요 시간은 ${$(&#x27;#totalTime&#x27;).textContent}, 복귀 여유는 ${$(&#x27;#buffer&#x27;).textContent}입니다. 결정하면 오늘의 코스로 저장됩니다.`;
  $(&#x27;#modalBackdrop&#x27;).classList.add(&#x27;show&#x27;);
});
$(&#x27;#modalCancel&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;$(&#x27;#modalBackdrop&#x27;).classList.remove(&#x27;show&#x27;));
$(&#x27;#modalConfirm&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{
  $(&#x27;#modalBackdrop&#x27;).classList.remove(&#x27;show&#x27;);
  showToast(&#x27;오늘의 0차 코스로 저장했어요!&#x27;);
  $(&#x27;#confirmBtn&#x27;).textContent=&#x27;✓ 코스 결정 완료&#x27;;
  $(&#x27;#confirmBtn&#x27;).style.background=&#x27;var(--green)&#x27;;
});
$(&#x27;#addBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;parent.postMessage({type:&#x27;0cha-navigation&#x27;,screen:&#x27;list&#x27;},&#x27;*&#x27;));
$(&#x27;#backBtn&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;parent.postMessage({type:&#x27;0cha-navigation&#x27;,screen:&#x27;map&#x27;},&#x27;*&#x27;));
$$(&#x27;nav button&#x27;).forEach(btn=&gt;btn.addEventListener(&#x27;click&#x27;,()=&gt;{
  $$(&#x27;nav button&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  btn.classList.add(&#x27;active&#x27;);
  if(btn.dataset.tab!==&#x27;지도&#x27;) showToast(`${btn.dataset.tab} 화면 연결은 다음 단계에서 설정할 수 있어요.`);
}));
updateTimer();
&lt;/script&gt;

&lt;script&gt;
(function(){
  const map = {&#x27;홈&#x27;:&#x27;home&#x27;,&#x27;검색&#x27;:&#x27;list&#x27;,&#x27;지도&#x27;:&#x27;map&#x27;,&#x27;관심공간&#x27;:&#x27;favorites&#x27;,&#x27;마이페이지&#x27;:&#x27;mypage&#x27;};
  document.addEventListener(&#x27;click&#x27;, function(e){
    const btn = e.target.closest(&#x27;nav button, .nav-item&#x27;);
    if (!btn) return;
    const label = (btn.dataset.tab || btn.dataset.nav || btn.textContent || &#x27;&#x27;).trim();
    const target = map[label];
    if (!target) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    parent.postMessage({type:&#x27;0cha-navigation&#x27;, screen:target}, &#x27;*&#x27;);
  }, true);
})();
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </section>

  <nav class="nav">
    <button class="active" data-screen="home"><span class="symbol">⌂</span>홈</button>
    <button data-screen="list"><span class="symbol">⌕</span>검색</button>
    <button data-screen="map"><span class="symbol">⌖</span>지도</button>
    <button data-screen="favorites"><span class="symbol">♡</span>관심공간</button>
    <button data-screen="mypage"><span class="symbol">☻</span>마이페이지</button>
  </nav>

  <div class="modal-bg" id="filterModal">
    <div class="sheet">
      <div class="sheet-title"><span>카테고리 (복수 선택)</span><button class="small-btn" id="resetFilter">초기화</button></div>
      <div class="sheet-section">
        <div class="chips" id="categoryChips">
          <button class="chip active" data-category="카페">카페</button>
          <button class="chip active" data-category="소품샵">소품샵</button>
          <button class="chip" data-category="쇼핑">쇼핑</button>
          <button class="chip" data-category="편의시설">편의시설</button>
          <button class="chip" data-category="서점">서점</button>
          <button class="chip" data-category="전시·팝업">전시·팝업</button>
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-label">정렬</div>
        <div class="chips" id="sheetSort">
          <button class="chip active" data-sort="거리순">거리순</button>
          <button class="chip" data-sort="체류시간순">체류시간순</button>
        </div>
      </div>
      <div class="sheet-section">
        <div class="sheet-label">보기 방식</div>
        <div class="chips" id="viewMode">
          <button class="chip active" data-view="목록">목록</button>
          <button class="chip" data-view="카드">카드</button>
        </div>
      </div>
      <button class="primary" id="applyFilter">12건 보기</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const places = [
 {id:1,name:"카페 모리",category:"카페",distance:6,stay:90,extra:60},
 {id:2,name:"소품샵 담",category:"소품샵",distance:9,stay:60,extra:90},
 {id:3,name:"온더테이블",category:"카페",distance:4,stay:45,extra:120},
 {id:4,name:"성수 문구상점",category:"쇼핑",distance:11,stay:30,extra:130},
 {id:5,name:"작은 책방",category:"서점",distance:8,stay:50,extra:100},
 {id:6,name:"아트 팝업 스튜디오",category:"전시·팝업",distance:15,stay:80,extra:25}
];
let waitMinutes=180, sortMode="거리순", selectedCategories=new Set(["카페","소품샵"]), favorites=new Set(), secondsLeft=3*3600, currentDetailId=1, courseIds=new Set();
const $=id=>document.getElementById(id);
function toast(message){$("toast").textContent=message;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1900)}
function updateTime(){
 const h=Math.floor(waitMinutes/60),m=waitMinutes%60;
 $("timeValue").textContent=`${h? h+"시간 ":""}${String(m).padStart(2,"0")}분`;
 document.querySelectorAll("#timeChips .chip").forEach(b=>b.classList.toggle("active",Number(b.dataset.minutes)===waitMinutes));
 secondsLeft=waitMinutes*60;
 $("timerText").textContent=`${Math.floor(secondsLeft/3600)}:${String(Math.floor(secondsLeft%3600/60)).padStart(2,"0")}:${String(secondsLeft%60).padStart(2,"0")}`;
}
function showScreen(which){
 const ids={home:"homeScreen",list:"listScreen",detail:"detailScreen",map:"mapScreen",favorites:"favoritesScreen",mypage:"mypageScreen",course:"courseDetailScreen"};
 Object.entries(ids).forEach(([key,id])=>$(id).classList.toggle("show",key===which));
 $(".app").classList.toggle("external-screen",["favorites","mypage","course"].includes(which));
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===(which==="detail"?"list":which==="course"?"map":which)));
 if(which==="list")renderPlaces();
 if(which==="map")renderCourseMap();
}
function renderCourseMap(){
 const ids=[...courseIds];
 const selected=ids.map(id=>places.find(p=>p.id===id)).filter(Boolean);
 const fallback=[places[0],places[1]];
 const routePlaces=selected.length?selected:fallback;
 $("courseCount").textContent=`장소 ${routePlaces.length}곳`;
 const totalStay=routePlaces.reduce((sum,p)=>sum+p.stay,0);
 const totalWalk=routePlaces.reduce((sum,p)=>sum+p.distance,0)+10;
 const total=totalStay+totalWalk;
 $("courseDuration").textContent=`총 ${Math.floor(total/60)?Math.floor(total/60)+"시간 ":""}${total%60}분`;
 $("courseReturn").textContent=`복귀 마감까지 여유 ${Math.max(0,waitMinutes-totalWalk-totalStay)}분`;
 const pin1=routePlaces[0], pin2=routePlaces[1];
 $("mapPinOne").textContent=pin1?`1 ${pin1.name}`:"장소 추가";
 $("mapPinTwo").style.display=pin2?"block":"none";
 if(pin2)$("mapPinTwo").textContent=`2 ${pin2.name}`;
 $("routeLine").setAttribute("points",routePlaces.length>1?"60,430 60,320 145,320 145,210 250,210 250,100 315,100":"60,430 60,320 145,320 145,210");
}
function renderPlaces(){
 const q=$("placeSearch").value.trim().toLowerCase();
 let list=places.filter(p=>(selectedCategories.size===0||selectedCategories.has(p.category))&&(p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
 list.sort((a,b)=>sortMode==="거리순"?a.distance-b.distance:a.stay-b.stay);
 $("resultCount").textContent=`결과 ${list.length}건`;
 $("placeList").innerHTML=list.length?list.map(p=>{
  const canFit=p.distance*2+p.stay<=waitMinutes;
  return `<article class="place-card" data-id="${p.id}">
   <div class="place-img">이미지</div>
   <div><div class="place-name">${p.name}</div><div class="place-kind">${p.category}</div>
   <div class="tags"><span class="tag">도보 ${p.distance}분</span><span class="tag">체류 ${p.stay}분</span><span class="tag ${canFit?"good":"tight"}">${canFit?"여유 "+Math.max(0,waitMinutes-p.distance*2-p.stay)+"분":"시간이 빠듯해요"}</span></div></div>
   <button class="heart ${favorites.has(p.id)?"saved":""}" data-fav="${p.id}" aria-label="관심공간 저장">${favorites.has(p.id)?"♥":"♡"}</button>
  </article>`;
 }).join(""):`<div class="empty">조건에 맞는 공간이 없어요.<br>검색어 또는 필터를 바꿔보세요.</div>`;
}
$("minusTime").addEventListener("click",()=>{waitMinutes=Math.max(30,waitMinutes-30);updateTime()});
$("plusTime").addEventListener("click",()=>{waitMinutes=Math.min(360,waitMinutes+30);updateTime()});
document.querySelectorAll("#timeChips .chip").forEach(b=>b.addEventListener("click",()=>{waitMinutes=Number(b.dataset.minutes);updateTime()}));
$("loadPrevious").addEventListener("click",()=>{
 const saved=localStorage.getItem("0cha-wait");
 if(saved){try{const d=JSON.parse(saved);waitMinutes=d.waitMinutes||180;$("locationInput").value=d.location||"";updateTime();toast("이전 웨이팅 정보를 불러왔어요.")}catch(e){toast("저장된 정보가 올바르지 않아요.")}}
 else{toast("저장된 웨이팅 정보가 없어 현재 정보를 저장했어요.");localStorage.setItem("0cha-wait",JSON.stringify({waitMinutes,location:$("locationInput").value}))}
});
$("findPlaces").addEventListener("click",()=>{
 if(!$("locationInput").value.trim()){toast("식당 위치를 입력해 주세요.");$("locationInput").focus();return}
 localStorage.setItem("0cha-wait",JSON.stringify({waitMinutes,location:$("locationInput").value.trim()}));
 $("placeSearch").value="";showScreen("list");
});
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>showScreen(b.dataset.screen)));
$("placeSearch").addEventListener("input",renderPlaces);
$("filterButton").addEventListener("click",()=>$("filterModal").classList.add("open"));
function renderSelectedCategories(){
 const holder=$("selectedCategoryChips");
 holder.innerHTML=[...selectedCategories].map(c=>`<button class="chip active" data-remove-category="${c}">${c} ✕</button>`).join("");
}
$("selectedCategoryChips").addEventListener("click",e=>{
 const b=e.target.closest("[data-remove-category]");if(!b)return;
 selectedCategories.delete(b.dataset.removeCategory);
 document.querySelectorAll("#categoryChips .chip").forEach(ch=>ch.classList.toggle("active",selectedCategories.has(ch.dataset.category)));
 renderSelectedCategories();renderPlaces();
});
$("resetFilter").addEventListener("click",()=>{
 selectedCategories.clear();
 document.querySelectorAll("#categoryChips .chip").forEach(ch=>ch.classList.remove("active"));
 renderSelectedCategories();renderPlaces();
});
document.querySelectorAll("#viewMode .chip").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll("#viewMode .chip").forEach(ch=>ch.classList.toggle("active",ch===b));
}));
if ($("filterModal")) $("filterModal").addEventListener("click",e=>{if(e.target===$("filterModal"))$("filterModal").classList.remove("open")});
document.querySelectorAll("#categoryChips .chip").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.category;if(selectedCategories.has(c)){selectedCategories.delete(c);b.classList.remove("active")}else{selectedCategories.add(c);b.classList.add("active")}renderSelectedCategories()}));
function setSort(mode){sortMode=mode;document.querySelectorAll("#sheetSort .chip").forEach(b=>b.classList.toggle("active",b.dataset.sort===mode));$("sortButton").textContent=mode+" ▾";renderPlaces()}
document.querySelectorAll("#sheetSort .chip").forEach(b=>b.addEventListener("click",()=>setSort(b.dataset.sort)));
$("sortButton").addEventListener("click",()=>setSort(sortMode==="거리순"?"체류시간순":"거리순"));
$("applyFilter").addEventListener("click",()=>{$("filterModal").classList.remove("open");renderSelectedCategories();renderPlaces()});
$("placeList").addEventListener("click",e=>{
 const fav=e.target.closest("[data-fav]");
 if(fav){const id=Number(fav.dataset.fav);favorites.has(id)?favorites.delete(id):favorites.add(id);renderPlaces();return}
 const card=e.target.closest(".place-card");if(card){openDetail(Number(card.dataset.id));}
});
function openDetail(id){
 const p=places.find(item=>item.id===id);if(!p)return;
 currentDetailId=id;
 $("detailName").textContent=p.name;
 $("detailCategory").textContent=p.category;
 $("detailTimeTag").textContent="여유 "+Math.max(0,waitMinutes-p.distance*2-p.stay)+"분";
 $("detailDistance").textContent=(p.distance*80)+"m";
 $("detailWalk").textContent="도보 "+p.distance+"분";
 $("detailStay").textContent=p.stay+"분";
 $("saveDetail").textContent=favorites.has(id)?"♥ 관심공간 저장":"♡ 관심공간 저장";
 showScreen("detail");
}
$("saveDetail").addEventListener("click",()=>{
 favorites.has(currentDetailId)?favorites.delete(currentDetailId):favorites.add(currentDetailId);
 $("saveDetail").textContent=favorites.has(currentDetailId)?"♥ 관심공간 저장":"♡ 관심공간 저장";
 toast(favorites.has(currentDetailId)?"관심공간에 저장했어요.":"관심공간 저장을 해제했어요.");
});
$("addToCourse").addEventListener("click",()=>{
 courseIds.add(currentDetailId);
 localStorage.setItem("0cha-course",JSON.stringify([...courseIds]));
 toast("이번 웨이팅 코스에 공간을 추가했어요.");
});
$("timer").addEventListener("click",()=>toast("남은 시간은 홈 화면에서 수정할 수 있어요."));
$("courseDetailButton").addEventListener("click",()=>showScreen("course"));
$("addMorePlaces").addEventListener("click",()=>showScreen("list"));
window.addEventListener("message",e=>{if(e.data&&e.data.type==="0cha-navigation"&&["home","list","map","favorites","mypage"].includes(e.data.screen))showScreen(e.data.screen)});
try{const savedCourse=JSON.parse(localStorage.getItem("0cha-course")||"[]");savedCourse.forEach(id=>courseIds.add(Number(id)))}catch(e){}
updateTime();
renderSelectedCategories();
</script>
